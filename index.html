<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tareas | Gestor de Tareas</title>
    <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script>
        // aplica el tema guardado antes de pintar, para evitar el flash blanco/negro
        (function () {
            const tema = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", tema);
        })();
    </script>
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <img src="assets/icons/logo.png" alt="Logo del gestor de tareas" class="logo">
            <h1>Gestor de Tareas</h1>
        </div>

        <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema claro/oscuro">
            <span class="theme-icon">🌙</span>
        </button>

        <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html" aria-current="page">Inicio</a></li>
                <li><a href="agregar.html">Agregar tarea</a></li>
                <li><a href="estadisticas.html">Estadísticas</a></li>
                <li><a href="acerca.html">Acerca de</a></li>
            </ul>
        </nav>
        </div>
    </header>

    <main class="container">
        <section class="tasks-toolbar">
            <h2>Mis tareas</h2>

            <p>Pendientes: <span id="contador-pendientes">0</span> | Completadas: <span id="contador-completadas">0</span></p>

            <div class="filters">
                <select id="filter-status">
                    <option value="">Todos los estados</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="completada">Completada</option>
                </select>
                <select id="filter-priority">
                    <option value="">Todas las prioridades</option>
                    <option value="alta">Alta</option>
                    <option value="media">Media</option>
                    <option value="baja">Baja</option>
                </select>
                <select id="filter-category">
                    <option value="">Todas las categorías</option>
                    <option value="trabajo">Trabajo</option>
                    <option value="estudio">Estudio</option>
                    <option value="personal">Personal</option>
                </select>
                <select id="sort-date">
                    <option value="">Sin ordenar</option>
                    <option value="asc">Fecha: más próxima primero</option>
                    <option value="desc">Fecha: más lejana primero</option>
                </select>
            </div>
        </section>

        <section class="tasks-list-section">
            <div id="task-list" class="task-grid">
            </div>

            <p id="empty-state" class="empty-state" hidden>
                No tenés tareas todavía. <a href="agregar.html">Agregá la primera</a>.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>Trabajo Práctico Nº1 — Programación II — UTN Facultad Regional Rosario</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
